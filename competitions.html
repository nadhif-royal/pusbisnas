<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pusbisnas | Kompetisi</title>
    
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body class="luxury-dark">

    <nav class="navbar premium-glass" data-aos="fade-down" data-aos-duration="800">
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-box-light">
                    <img src="assets/Logo Pusbisnas.png" alt="Logo Pusbisnas">
                </div>
            </a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link btn-gold-outline"><i class="fas fa-home"></i> Kembali ke Beranda</a></li>
                <li style="display: flex; align-items: center; margin-left: 10px;">
                    <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
                        <i class="fas fa-sun"></i>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <!-- ONGOING COMPETITIONS SECTION -->
    <section class="ongoing-section" style="padding-top: 150px; min-height: 80vh;">
        <div class="container">
            <div class="section-heading" data-aos="fade-up">
                <span class="subtitle-gold" style="margin-bottom: 10px;">Pilih Passion Kamu</span>
                <h2 class="title-serif">Ongoing Competitions</h2>
                <div class="gold-line"></div>
            </div>

            <div class="poster-grid" id="kompetisi-dinamis">
                <!-- Data card lomba akan dimunculkan secara otomatis oleh Firebase di sini -->
            </div>
        </div>

        <!-- ================= MODALS DYNAMIC AREA ================= -->
        <div id="modals-dinamis">
            <!-- Data Pop-up Modal akan dimunculkan secara otomatis oleh Firebase di sini -->
        </div>

        <script>
            function openModal(id) {
                document.getElementById(id).classList.add('active');
                document.body.style.overflow = 'hidden'; 
            }
            function closeModal(id) {
                document.getElementById(id).classList.remove('active');
                document.body.style.overflow = 'auto'; 
            }
            function closeModalOutside(event, id) {
                if (event.target.id === id) { closeModal(id); }
            }
        </script>
    </section>

    <footer class="footer-premium">
        <div class="container">
            <div class="footer-bottom" data-aos="fade-in" data-aos-delay="100">
                <div class="copyright">
                    &copy; 2026 Pusat Bisnis Nasional. All Rights Reserved.
                </div>
                <div class="footer-social-mini">
                    <a href="https://mail.google.com/mail/?view=cm&fs=1&to=pusatbisnisnasional@gmail.com" target="_blank"><i class="fas fa-envelope"></i></a>
                    <a href="https://www.instagram.com/pusbisnas/" target="_blank"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/main.js"></script>
    
    <!-- ============================================== -->
    <!-- SCRIPT FIREBASE UNTUK CMS PUSBISNAS -->
    <!-- ============================================== -->
    <script type="module" src="js/cms.js"></script>
</body>
</html>
